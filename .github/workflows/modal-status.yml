name: Modal Status & Logs

on:
  workflow_dispatch:
    inputs:
      test_http:
        description: "Testar requisição HTTP autenticada para o endpoint"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Modal app & logs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      OPENJUTSU_PASSWORD: ${{ secrets.OPENJUTSU_PASSWORD }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal CLI
        run: pip install --no-cache-dir modal

      - name: App & container info
        run: |
          modal app list
          modal app info openjutsu-cloud || true
          modal container list || true

      - name: Fetch recent Modal logs
        run: |
          modal app logs openjutsu-cloud --tail 300 --timestamps --show-function-id || true

      - name: Test authenticated HTTP endpoint
        if: ${{ inputs.test_http }}
        run: |
          URL="https://qualidadeufs--openjutsu-cloud-openjutsuserver-serve.us-east.modal.run"
          echo "Testing unauthenticated (expect 401 after cold start):"
          curl -sS -i -L --max-time 300 "$URL/" | head -n 30 || true
          echo ""
          echo "Testing authenticated (expect 200):"
          curl -sS -i -L --max-time 300 -u "openjutsu:$OPENJUTSU_PASSWORD" "$URL/" | head -n 30 || true
          echo ""
          echo "Testing /api/models:"
          curl -sS -i -L --max-time 120 -u "openjutsu:$OPENJUTSU_PASSWORD" "$URL/api/models" | head -n 30 || true
          echo ""
          echo "Testing POST /api/setup with browser Origin:"
          curl -sS -i -L --max-time 120 -u "openjutsu:$OPENJUTSU_PASSWORD" \
            -X POST "$URL/api/setup" \
            -H "Content-Type: application/json" \
            -H "Origin: $URL" \
            -H "Sec-Fetch-Site: same-origin" \
            -d '{"kind":"simple","settings":{"role":"","resolution":"736p","hatFix":false,"noLipSync":false,"margin":"normal","target":"person","clipSeconds":5,"motion":512,"seed":1},"model":{"model":"minimax_h3_ref2va_pruned_int8_convrot.safetensors","loras":[{"name":"minimax_h3_DMAD_4step_full_lora_avg_rank_39_bf16.safetensors","strength":1}],"steps":6,"textEncoder":"qwen3vl_32b_minimax_h3_int4_convrot.safetensors","videoVae":"minimax_h3_video_vae_int8_convrot.safetensors","audioVae":"minimax_h3_audio_vae_fp32.safetensors","acceleration":"none"}}' \
            | head -n 40 || true
          echo ""
          echo "Logs after HTTP test:"
          modal app logs openjutsu-cloud --tail 150 --timestamps || true
